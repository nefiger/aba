<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>African Biologicals Alliance | Chapters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/admin.css">
</head>
<body data-admin-page="chapters">
  <main class="admin-shell">
    <div class="admin-app">
      <aside data-admin-sidebar></aside>
      <div class="admin-main">
        <section class="panel">
          <div class="page-head">
            <div class="page-head-copy">
              <div class="eyebrow">Settings</div>
              <h1 class="page-title">Chapters</h1>
              <p class="page-subtitle">Reference records for chapter scope, cadence, readiness, and named leads.</p>
            </div>
            <div class="action-row">
              <button class="button">Reorder</button>
              <button class="button primary">Create chapter</button>
            </div>
          </div>
        </section>

        <section class="panel datagrid-panel">
          <div class="table-head">
            <div>
              <h2 class="table-title">Chapter records</h2>
            </div>
            <div class="summary-row">
              <span class="summary-chip">1 active chapter</span>
              <span class="summary-chip">1 planned chapter</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Chapter</th>
                  <th>Scope</th>
                  <th>Status</th>
                  <th>Lead</th>
                  <th>Cadence</th>
                  <th>Members</th>
                  <th>Readiness</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="chapter-rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="./assets/admin-shell.js"></script>
  <script src="./assets/admin-data.js"></script>
  <script src="./assets/admin-render.js"></script>
  <script>
    const data = window.ABA_ADMIN_DATA;
    const ui = window.ABA_ADMIN_RENDER;
    const chapterTone = {
      "Active pilot": "good",
      Planned: "waiting",
    };

    document.getElementById("chapter-rows").innerHTML = data.chapters.map((item) => `
      <tr class="settings-row">
        <td><strong>${item.chapter}</strong></td>
        <td>${ui.value(item.scope)}</td>
        <td>${ui.status(item.status, chapterTone[item.status])}</td>
        <td>${ui.value(item.lead)}</td>
        <td>${ui.value(item.cadence)}</td>
        <td>${ui.value(String(item.members))}</td>
        <td>${ui.value(item.readiness)}</td>
        <td class="settings-actions">${ui.iconButton("edit", "Edit chapter", "review")}</td>
      </tr>
    `).join("");
  </script>
</body>
</html>
