<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>African Biologicals Alliance | Contacts & Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/admin.css">
</head>
<body data-admin-page="network">
  <main class="admin-shell">
    <div class="admin-app">
      <aside data-admin-sidebar></aside>
      <div class="admin-main">
        <section class="panel">
          <div class="page-head">
            <div class="page-head-copy">
              <div class="eyebrow">Contacts & Network</div>
              <h1 class="page-title">Contacts & Network</h1>
              <p class="page-subtitle">Relationship records across members, subscribers, and wider technical-network contacts.</p>
            </div>
          </div>
        </section>

        <section class="panel datagrid-panel">
          <div class="table-head">
            <div>
              <h2 class="table-title">Relationship records</h2>
            </div>
            <div class="summary-row">
              <span class="summary-chip">2 active contacts</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Organisation</th>
                  <th>Relationship</th>
                  <th>Country</th>
                  <th>Owner</th>
                  <th>Next step</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="contact-rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="./assets/admin-shell.js"></script>
  <script src="./assets/admin-data.js"></script>
  <script src="./assets/admin-render.js"></script>
  <script>
    const data = window.ABA_ADMIN_DATA;
    const ui = window.ABA_ADMIN_RENDER;
    const relationshipTone = {
      Subscriber: "waiting",
      "Member contact": "good",
    };

    document.getElementById("contact-rows").innerHTML = data.contacts.map((item) => `
      <tr>
        <td><strong>${item.name}</strong></td>
        <td>${ui.value(item.organisation)}</td>
        <td>${ui.status(item.relationship, relationshipTone[item.relationship])}</td>
        <td>${ui.value(item.country)}</td>
        <td>${ui.value(item.owner)}</td>
        <td>${item.next_step}</td>
        <td class="settings-actions">${ui.iconButton("edit", "Open contact", "review")}</td>
      </tr>
    `).join("");
  </script>
</body>
</html>
