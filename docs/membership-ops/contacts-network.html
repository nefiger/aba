<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>African Biologicals Alliance | Contacts & Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/admin.css">
</head>
<body data-admin-page="network">
  <main class="admin-shell">
    <div class="admin-app">
      <aside data-admin-sidebar></aside>
      <div class="admin-main">
        <section class="panel">
          <div class="page-head">
            <div class="page-head-copy">
              <div class="eyebrow">Contacts & Network</div>
              <h1 class="page-title">Contacts & Network</h1>
              <p class="page-subtitle">Stub module for broader relationship records beyond paid membership.</p>
            </div>
          </div>
        </section>

        <section class="panel stub-panel">
          <div class="stub-grid">
            <div>
              <h2 class="table-title">Module role</h2>
              <p class="stub-note">This stub reserves the future home for contacts, subscribers, and technical network profiles within the same relationship graph.</p>
            </div>
            <div class="table-wrap">
              <table class="stub-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Relationship</th>
                    <th>Owner</th>
                  </tr>
                </thead>
                <tbody id="contact-rows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="./assets/admin-shell.js"></script>
  <script src="./assets/admin-data.js"></script>
  <script>
    document.getElementById("contact-rows").innerHTML = window.ABA_ADMIN_DATA.contacts.map((item) => `
      <tr>
        <td><strong>${item.name}</strong></td>
        <td>${item.relationship}</td>
        <td>${item.owner}</td>
      </tr>
    `).join("");
  </script>
</body>
</html>
