<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>African Biologicals Alliance | Members</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/admin.css">
</head>
<body data-admin-page="members">
  <main class="admin-shell">
    <div class="admin-app">
      <aside data-admin-sidebar></aside>
      <div class="admin-main">
        <section class="panel">
          <div class="page-head">
            <div class="page-head-copy">
              <div class="eyebrow">Membership</div>
              <h1 class="page-title">Members</h1>
              <p class="page-subtitle">Approved and managed membership relationships, including dues and renewal visibility.</p>
            </div>
          </div>
        </section>

        <section class="panel datagrid-panel">
          <div class="table-head">
            <div>
              <h2 class="table-title">Relationship directory</h2>
            </div>
            <div class="summary-row">
              <span class="summary-chip">2 pending activation</span>
              <span class="summary-chip">1 lapsed</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Organisation</th>
                  <th>Plan</th>
                  <th>Member state</th>
                  <th>Billing state</th>
                  <th>Chapter</th>
                  <th>Renewal state</th>
                  <th>Renewal date</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="member-rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="./assets/admin-shell.js"></script>
  <script src="./assets/admin-data.js"></script>
  <script src="./assets/admin-render.js"></script>
  <script>
    const data = window.ABA_ADMIN_DATA;
    const ui = window.ABA_ADMIN_RENDER;
    const memberTone = {
      Approved: "review",
      Active: "good",
      Suspended: "waiting",
      Lapsed: "alert",
    };
    const billingTone = {
      "Not billed": "alert",
      "Payment review": "review",
      Settled: "good",
      Overdue: "alert",
    };
    const renewalTone = {
      Current: "good",
      "Due soon": "waiting",
      Lapsed: "alert",
    };

    document.getElementById("member-rows").innerHTML = data.members.map((item) => `
      <tr>
        <td><strong>${item.organisation}</strong></td>
        <td>${ui.value(item.membership_type).replace('class="value-button"', 'class="value-button is-mono"')}</td>
        <td>${ui.status(item.relationship_status, memberTone[item.relationship_status])}</td>
        <td>${ui.status(item.billing_state, billingTone[item.billing_state])}</td>
        <td>${ui.value(item.chapter)}</td>
        <td>${ui.status(item.renewal_state, renewalTone[item.renewal_state])}</td>
        <td>${ui.value(item.renewal)}</td>
        <td class="settings-actions">${ui.iconButton("edit", "Edit member", "review")}</td>
      </tr>
    `).join("");
  </script>
</body>
</html>
