<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>African Biologicals Alliance | Membership Rules</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/admin.css">
</head>
<body data-admin-page="types">
  <main class="admin-shell">
    <div class="admin-app">
      <aside data-admin-sidebar></aside>
      <div class="admin-main">
        <section class="panel">
          <div class="page-head">
            <div class="page-head-copy">
              <div class="eyebrow">Settings</div>
              <h1 class="page-title">Membership Rules</h1>
              <p class="page-subtitle">Reference data for categories, types, fees, billing, and route availability.</p>
            </div>
            <div class="action-row">
              <button class="button">Reorder</button>
              <button class="button primary">Create rule</button>
            </div>
          </div>
        </section>

        <section class="panel datagrid-panel">
          <div class="table-head">
            <div>
              <h2 class="table-title">Membership rule records</h2>
            </div>
            <div class="summary-row">
              <span class="summary-chip">4 active policy records</span>
              <span class="summary-chip">1 restricted route</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Type code</th>
                  <th>Category</th>
                  <th>Annual fee</th>
                  <th>Billing cycle</th>
                  <th>Privileges</th>
                  <th>Availability</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="type-rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="./assets/admin-shell.js"></script>
  <script src="./assets/admin-data.js"></script>
  <script src="./assets/admin-render.js"></script>
  <script>
    const data = window.ABA_ADMIN_DATA;
    const ui = window.ABA_ADMIN_RENDER;
    const statusTone = {
      Active: "good",
      Restricted: "waiting",
      Retired: "alert",
    };

    document.getElementById("type-rows").innerHTML = data.membership_types.map((item) => `
      <tr class="settings-row">
        <td>${ui.value(item.code).replace('class="value-button"', 'class="value-button is-mono"')}</td>
        <td>${ui.value(item.category)}</td>
        <td>${ui.value(item.annual_fee)}</td>
        <td>${ui.value(item.billing_cycle)}</td>
        <td>${ui.value(item.privileges).replace('class="value-button"', 'class="value-button is-truncate"')}</td>
        <td>${ui.value(item.availability).replace('class="value-button"', 'class="value-button is-truncate"')}</td>
        <td>${ui.status(item.status, statusTone[item.status])}</td>
        <td class="settings-actions">${ui.iconButton("edit", "Edit rule", "review")}</td>
      </tr>
    `).join("");
  </script>
</body>
</html>
