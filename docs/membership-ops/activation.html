<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>African Biologicals Alliance | Member Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/admin.css">
</head>
<body data-admin-page="pending-activation">
  <main class="admin-shell">
    <div class="admin-app">
      <aside data-admin-sidebar></aside>
      <div class="admin-main">
        <section class="panel">
          <div class="page-head">
            <div class="page-head-copy">
              <div class="eyebrow">Finance</div>
              <h1 class="page-title">Member Finance</h1>
              <p class="page-subtitle">Dues, invoice progress, payment review, and finance clearance.</p>
            </div>
          </div>
        </section>

        <section class="panel datagrid-panel">
          <div class="table-head">
            <div>
              <h2 class="table-title">Finance clearance</h2>
            </div>
            <div class="summary-row">
              <span class="summary-chip">3 finance records need action</span>
              <span class="summary-chip">2 invoice actions due</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Organisation</th>
                  <th>Approved type</th>
                  <th>Invoice state</th>
                  <th>Payment state</th>
                  <th>Finance status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="activation-rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="./assets/admin-shell.js"></script>
  <script src="./assets/admin-data.js"></script>
  <script src="./assets/admin-render.js"></script>
  <script>
    const data = window.ABA_ADMIN_DATA;
    const ui = window.ABA_ADMIN_RENDER;
    const invoiceTone = {
      Draft: "waiting",
      "Not issued": "alert",
      Issued: "good",
      Blocked: "alert",
    };
    const paymentTone = {
      "Not due": "waiting",
      "Payment review": "review",
      Paid: "good",
      "Not started": "alert",
    };
    const financeTone = {
      "Invoice to issue": "alert",
      "Awaiting proof": "waiting",
      "Fee setup blocked": "alert",
      Clear: "good",
    };

    document.getElementById("activation-rows").innerHTML = data.pending_activation.map((item) => `
      <tr>
        <td><strong>${item.organisation}</strong></td>
        <td>${ui.value(item.approved_type).replace('class="value-button"', 'class="value-button is-mono"')}</td>
        <td>${ui.status(item.invoice_state, invoiceTone[item.invoice_state])}</td>
        <td>${ui.status(item.payment_state, paymentTone[item.payment_state])}</td>
        <td>${ui.status(item.finance_status, financeTone[item.finance_status])}</td>
        <td>
          <div class="inline-actions">
            ${ui.iconButton("invoice", "Issue invoice", "review")}
            ${ui.iconButton("approve", "Record payment", "good")}
            ${ui.iconButton("edit", "Open finance record", "review")}
          </div>
        </td>
      </tr>
    `).join("");
  </script>
</body>
</html>
