<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABA Product Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    :root {
      --ink: #173039;
      --muted: #5c6f73;
      --muted-strong: #41565b;
      --surface: rgba(255, 252, 246, 0.9);
      --surface-strong: rgba(255, 255, 255, 0.92);
      --line: rgba(23, 48, 57, 0.1);
      --green: #2b6b4f;
      --green-soft: #e7f0e8;
      --sage: #eef6ef;
      --amber: #f0b429;
      --amber-soft: #fff2cf;
      --red: #d94a4a;
      --red-soft: #fde4e4;
      --teal: #1f7a79;
      --teal-soft: #def1f0;
      --slate-soft: #eceef0;
      --shadow: 0 18px 40px -30px rgba(20, 32, 34, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Public Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.18) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.18) 1px, transparent 1px),
        radial-gradient(circle at top left, rgba(99, 154, 108, 0.14), transparent 24%),
        linear-gradient(180deg, #f4efe5 0%, #fbf8f2 52%, #f2f4ed 100%);
      background-size: 28px 28px, 28px 28px, auto, auto;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }

    .shell {
      width: min(1260px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 14px 0 28px;
    }

    .surface,
    .card,
    .search-shell,
    .category-chip,
    .shortcut-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .topbar {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--green-soft);
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .mini,
    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .mini { color: var(--muted); }
    .eyebrow { color: var(--green); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .micro-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .micro-stat {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
    }

    .micro-stat strong {
      font-size: 0.95rem;
      line-height: 1;
      font-weight: 800;
      color: var(--ink);
    }

    .micro-stat span {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
      font-weight: 700;
    }

    .nav a.active { color: var(--green); }

    .subnav {
      margin-top: 12px;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .subnav a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .subnav a.active {
      background: var(--green-soft);
      border-color: rgba(43, 107, 79, 0.18);
      color: var(--green);
    }

    .section {
      margin-top: 12px;
      padding: 22px;
    }

    .hero-grid,
    .shortcuts,
    .results-head,
    .filter-grid,
    .catalogue-grid,
    .card-meta,
    .card-metrics,
    .reading-key {
      display: grid;
      gap: 12px;
    }

    .hero-grid,
    .results-head {
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
    }

    .shortcuts {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 12px;
    }

    .filter-grid {
      grid-template-columns: minmax(260px, 1.25fr) repeat(3, minmax(180px, 0.4fr));
      align-items: center;
      margin-top: 14px;
    }

    .catalogue-grid {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      margin-top: 14px;
    }

    .reading-key {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-top: 18px;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    h1 {
      margin-top: 8px;
      font-size: clamp(1.7rem, 2vw, 2.25rem);
      line-height: 1.04;
      letter-spacing: -0.035em;
      font-weight: 800;
    }

    h2 {
      font-size: clamp(1.3rem, 2vw, 1.85rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    h3 {
      font-size: 1.05rem;
      line-height: 1.28;
      font-weight: 800;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.62;
    }

    .search-shell,
    .card,
    .shortcut-card {
      padding: 14px;
    }

    .search-shell {
      padding: 0;
      overflow: hidden;
      box-shadow: none;
      backdrop-filter: none;
      background: white;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 62px;
      padding: 0 18px;
    }

    .search-row input {
      border: 0;
      outline: 0;
      width: 100%;
      background: transparent;
      color: var(--ink);
      font-size: 18px;
    }

    .search-row svg {
      width: 24px;
      height: 24px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .select {
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      color: var(--ink);
      padding: 0 14px;
      width: 100%;
    }

    .shortcut-card {
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
      box-shadow: none;
      background: rgba(255, 255, 255, 0.78);
      position: relative;
      overflow: visible;
    }

    .shortcut-card:hover {
      transform: translateY(-2px);
    }

    .shortcut-card.active {
      border-color: rgba(43, 107, 79, 0.35);
      background: rgba(231, 240, 232, 0.8);
    }

    .shortcut-number {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .category-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .category-chip {
      min-height: 40px;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: none;
      cursor: pointer;
    }

    .category-row .category-chip:nth-child(2) { color: var(--green); background: rgba(231, 240, 232, 0.86); }
    .category-row .category-chip:nth-child(3) { color: var(--teal); background: rgba(222, 241, 240, 0.86); }
    .category-row .category-chip:nth-child(4) { color: #8d6400; background: rgba(255, 242, 207, 0.92); }
    .category-row .category-chip:nth-child(5) { color: #59656b; background: rgba(236, 238, 240, 0.92); }

    .category-chip.active {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }

    .chip-content {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .chip-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 8px;
      background: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .chip-symbol svg,
    .legend-symbol svg,
    .card-icon svg,
    .model-symbol svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-icon svg {
      width: 24px;
      height: 24px;
    }

    .crop-chip img {
      display: block;
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .tooltip-anchor {
      position: relative;
    }

    .tooltip-anchor::before,
    .tooltip-anchor::after {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, transform 140ms ease;
      z-index: 12;
    }

    .tooltip-anchor::before {
      content: "";
      left: 18px;
      bottom: calc(100% + 2px);
      transform: translate(0, 4px);
      border: 6px solid transparent;
      border-top-color: rgba(23, 48, 57, 0.92);
    }

    .tooltip-anchor::after {
      content: attr(data-tooltip);
      left: 0;
      bottom: calc(100% + 12px);
      transform: translate(0, 4px);
      min-width: 180px;
      max-width: 240px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(23, 48, 57, 0.94);
      color: #f7f4ee;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 600;
      text-transform: none;
      text-align: left;
      box-shadow: 0 14px 30px -20px rgba(0,0,0,0.45);
      white-space: normal;
    }

    .tooltip-anchor:hover::before,
    .tooltip-anchor:hover::after,
    .tooltip-anchor:focus-visible::before,
    .tooltip-anchor:focus-visible::after {
      opacity: 1;
      transform: translate(0, 0);
    }

    .results-head {
      margin-bottom: 12px;
    }

    .card {
      --card-accent: var(--green);
      --card-soft: var(--green-soft);
      position: relative;
      overflow: visible;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: none;
    }

    .shortcut-card::after,
    .card::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, rgba(43, 107, 79, 0.95), rgba(31, 122, 121, 0.42));
      opacity: 0.72;
    }

    .card::after {
      background: linear-gradient(90deg, var(--card-accent) 0%, color-mix(in srgb, var(--card-accent) 34%, white) 100%);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(180deg, #f7fbf7 0%, var(--card-soft, var(--green-soft)) 100%);
      color: var(--card-accent, var(--green));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      gap: 8px;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.8;
    }

    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.amber { background: var(--amber-soft); color: #8d6400; }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.slate { background: #eceef0; color: #59656b; }

    .category-label {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .category-filter-button,
    .icon-filter-button {
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }

    .category-filter-button {
      text-align: left;
    }

    .category-filter-button:hover,
    .category-filter-button:focus-visible,
    .icon-filter-button:hover,
    .icon-filter-button:focus-visible {
      color: var(--card-accent, var(--green));
      outline: none;
    }

    .card-context,
    .key-chip,
    .guide-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .context-pill,
    .key-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(31, 122, 121, 0.08);
      color: var(--teal);
    }

    .context-pill {
      background: var(--card-soft, rgba(31, 122, 121, 0.08));
      color: var(--card-accent, var(--teal));
    }

    .info-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: rgba(23, 48, 57, 0.08);
      color: var(--muted-strong);
      font-size: 11px;
      font-weight: 800;
      cursor: help;
    }

    .summary-strip {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(43, 107, 79, 0.12);
      border-radius: 14px;
      background: rgba(238, 246, 239, 0.94);
      font-size: 14px;
      line-height: 1.45;
      color: var(--ink);
      font-weight: 700;
    }

    .summary-strip span {
      color: var(--muted);
      font-weight: 600;
    }

    .card-meta {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 16px;
      margin-top: 14px;
    }

    .meta-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .meta-value {
      margin-top: 4px;
      line-height: 1.4;
    }

    .card-meta > div {
      padding: 11px 12px;
      border-radius: 14px;
      background: rgba(244, 248, 246, 0.92);
    }

    .card-metrics {
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(23, 48, 57, 0.08);
    }

    .card-metrics > div {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(23, 48, 57, 0.04);
    }

    .metric-value {
      font-size: 1.25rem;
      line-height: 1;
      font-weight: 800;
      color: var(--ink);
    }

    .metric-label {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .key-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: rgba(31, 122, 121, 0.1);
      color: var(--teal);
      font-size: 12px;
      font-weight: 800;
    }

    .section-note {
      margin-top: 12px;
      max-width: 72ch;
      font-size: 14px;
      color: var(--muted-strong);
    }

    .results-summary {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .result-count {
      font-size: 14px;
      color: var(--muted-strong);
      font-weight: 700;
    }

    .filter-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(23, 48, 57, 0.1);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .filter-pill button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .filter-pill button:hover,
    .filter-pill button:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .active-legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(23, 48, 57, 0.08);
      border-radius: 16px;
      background: rgba(255,255,255,0.86);
    }

    .legend-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .legend-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--accent-soft, rgba(31, 122, 121, 0.12));
      color: var(--accent, var(--teal));
      font-size: 14px;
      font-weight: 800;
    }

    .legend-copy {
      max-width: 46ch;
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted-strong);
    }

    .meaning-strip strong {
      color: var(--card-accent, var(--green));
    }

    .crop-chip-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .crop-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: color-mix(in srgb, var(--card-soft, var(--green-soft)) 72%, white);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-decoration: none;
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .crop-chip:hover,
    .crop-chip:focus-visible {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--card-accent, var(--green)) 22%, white);
      outline: none;
    }

    .crop-chip.is-active {
      border-color: color-mix(in srgb, var(--card-accent, var(--green)) 48%, white);
      background: color-mix(in srgb, var(--card-soft, var(--green-soft)) 88%, white);
    }

    .crop-chip svg {
      width: 16px;
      height: 16px;
      stroke: var(--card-accent, var(--green));
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .model-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding: 12px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.88);
      border: 1px dashed rgba(23, 48, 57, 0.14);
    }

    .model-node {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 7px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--card-soft, var(--green-soft)) 78%, white);
      color: var(--card-accent, var(--green));
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .model-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      color: inherit;
    }

    .model-arrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .relationship-note {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted-strong);
    }

    @media (max-width: 1100px) {
      .hero-grid,
      .reading-key,
      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filter-grid .search-shell {
        grid-column: 1 / -1;
      }

      .catalogue-grid,
      .shortcuts {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 820px) {
      .hero-grid,

          return icons[symbol] || icons["B"];

        assetIcon(path) {
          return `<img src="${path}" alt="" aria-hidden="true">`;

          if (key.includes('citrus')) {
            return this.assetIcon('./assets/bioicons/citrus.svg');

            return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V15"/><path d="M9 20h6"/><path d="M8.2 15a4.8 4.8 0 0 1-2.2-4c0-2.8 2-5 4.7-5 .5-1.5 1.7-2.5 3.3-2.5 2 0 3.6 1.5 3.8 3.4 1.4.8 2.2 2.2 2.2 3.9 0 2.8-2.2 5.2-5.3 5.2Z"/></svg>';
          }
          if (key.includes('grapes')) {
            return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 7.5c1.6-2 3-3 3.5-3 .7 0 2.2 1.3 4.5 3.9"/><path d="M8.5 7.5c-1.1 1.4-1.8 3-1.8 4.8A5.3 5.3 0 0 0 12 18a5.3 5.3 0 0 0 5.3-5.7c0-1.8-.7-3.4-1.8-4.8"/></svg>';
          }
          if (key.includes('tomatoes') || key.includes('vegetables') || key.includes('peppers')) {
            return this.assetIcon('./assets/bioicons/tomato.svg');
          }
          if (key.includes('potatoes') || key.includes('groundnuts')) {
            return this.assetIcon('./assets/bioicons/potato.svg');
          }
          if (key.includes('flowers') || key.includes('ornamentals')) {
            return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><path d="M12 5.5c1.3 1.3 1.9 2.5 1.9 3.6S13.3 11 12 12.2c-1.3-1.2-1.9-2.3-1.9-3.1S10.7 6.8 12 5.5Z"/><path d="M18.5 12c-1.3 1.3-2.5 1.9-3.6 1.9S13 13.3 11.8 12c1.2-1.3 2.3-1.9 3.1-1.9s2.3.6 3.6 1.9Z"/><path d="M12 18.5c-1.3-1.3-1.9-2.5-1.9-3.6s.6-1.9 1.9-3.1c1.3 1.2 1.9 2.3 1.9 3.1s-.6 2.3-1.9 3.6Z"/><path d="M5.5 12c1.3-1.3 2.5-1.9 3.6-1.9s1.9.6 3.1 1.9c-1.2 1.3-2.3 1.9-3.1 1.9S6.8 13.3 5.5 12Z"/></svg>';
          }
          if (key.includes('maize') || key.includes('field') || key.includes('sweetcorn')) {
            return this.assetIcon('./assets/bioicons/maize.svg');
          }
          if (key.includes('wheat') || key.includes('barley')) {
            return this.assetIcon('./assets/bioicons/wheat.svg');
          }
          if (key.includes('soy') || key.includes('beans') || key.includes('legumes') || key.includes('cowpea')) {
            return this.assetIcon('./assets/bioicons/soybean.svg');
          }
          return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20c0-5.5 2.2-9.7 6.7-12.8"/><path d="M12 20c0-4.8-2-8.4-6.2-10.9"/><path d="M12 20V8"/></svg>';
        },
        cropDictionary: [
          { label: "Citrus", pattern: /\bcitrus\b/i },
          { label: "Apples", pattern: /\bapples?\b/i },
          { label: "Peaches", pattern: /\bpeaches?\b/i },
          { label: "Pears", pattern: /\bpears?\b/i },
          { label: "Avocado", pattern: /\bavocados?\b/i },

          { label: "Leafy greens", pattern: /\bleafy\b/i },
          { label: "Cruciferae", pattern: /\bcruciferae\b/i },
          { label: "Lucerne", pattern: /\blucerne\b/i },

          { label: "Barley", pattern: /\bbarley\b/i },
          { label: "Sweetcorn", pattern: /\bsweetcorn\b/i },
          { label: "Fruit trees", pattern: /\bfruit trees?\b/i },
          { label: "Garden plants", pattern: /\bgarden plants?\b/i }
        ],
        detectCropsFromText(text) {
          return this.cropDictionary
            .filter((entry) => entry.pattern.test(text))
            .map((entry) => entry.label);
        },
        extractCropLinks(product) {
          const explicitCropMeta = (product.meta || []).find((item) => /crop/i.test(item.label));
          const explicit = explicitCropMeta && explicitCropMeta.value
            ? String(explicitCropMeta.value)
                .split(',')
                .map((item) => item.trim())
                .filter(Boolean)
            : [];
          const inferred = this.detectCropsFromText([
            product.fit,
            product.relationship,
            ...(product.meta || []).map((item) => item.value)
          ].join(' '));
          return [...new Set([...explicit, ...inferred])].map((label) => ({
            label,
            icon: this.cropIcon(label),
            tooltip: `Filter catalogue to products linked to ${label}`
          }));
        },
        init() {
          const params = new URLSearchParams(window.location.search);
          const category = params.get('category');
          const crop = params.get('crop');
          const problem = params.get('problem');
          const pressure = params.get('pressure');
          const search = params.get('q');
          if (category && this.categories.some((item) => item.id === category)) this.activeCategory = category;
          if (crop) this.activeCrop = crop;
          if (problem) this.searchQuery = problem;
          if (!problem && pressure) this.searchQuery = pressure;
          if (search) this.searchQuery = search;
        },
        displayProductBadge(product) {
          if (product.badge !== 'Registered') return product.badge;
          const problemLinks = (product.meta || []).find((item) => item.label === 'Pressure links')?.value?.toLowerCase() || '';

          return 'Insect control';

          return `Filter to ${product.category} records`;
        },
        productBadgeTitle(product) {
          return `Context tag: ${this.displayProductBadge(product)}`;
        },
        summaryLead(product) {
          const leads = {
            biopesticide: 'Best for:',
            semiochemical: 'Works through:',
            inoculant: 'Supports:',
            biofertiliser: 'Helps with:'
          };
          return leads[product.categoryId] || 'Best for:';
        },
        fitText(product) {
          return String(product.fit || '')
            .replace(/where a behavioural control route is visible in the source file/gi, 'using a behavioural control approach')
            .replace(/visible in the source file/gi, 'visible in the current data')
            .replace(/visible in the register/gi, 'visible in the current data')
            .replace(/remedy source file/gi, 'current data')
            .replace(/source file/gi, 'current data');
        },
        modelLabel(model) {
          const label = model.label || '';
          if (label === 'Pressure') return 'Problem';
          if (label === 'Pressures') return 'Problems';
          return label;
        },
        modelDescription(model) {
          return String(model.description || '')
            .replace(/pest or disease pressures/gi, 'pests and diseases')
            .replace(/target pressure/gi, 'target problem')
            .replace(/pressure set/gi, 'problem set')
            .replace(/pressure/g, 'problem')
            .replace(/Pressures/g, 'Problems')
            .replace(/Pressure/g, 'Problem');
        },
        metaLabel(item) {
          const label = item.label || '';
          if (label === 'Pressure links') return 'Key problems';
          return label;
        },
        metricLabel(label) {
          if (label === 'Use rows') return 'Source records';
          if (label === 'Use row') return 'Source record';
          if (label === 'Crops shown') return 'Crops linked';
          if (label === 'Crop shown') return 'Crop linked';
          if (label === 'Source row') return 'Source record';
          if (label === 'Organic flag') return 'Organic';
          if (label === 'Problems') return 'Problem links';
          if (label === 'Problem') return 'Problem link';
          return label;
        },
        syncUrl() {
          const params = new URLSearchParams();
          if (this.activeCategory !== 'all') params.set('category', this.activeCategory);
          if (this.activeCrop !== 'all') params.set('crop', this.activeCrop);

          const query = params.toString();
          const next = `${window.location.pathname}${query ? `?${query}` : ''}`;
          window.history.replaceState({}, '', next);
        },
        setCategoryFilter(categoryId) {
          this.activeCategory = categoryId;
          this.syncUrl();
        },
        setCropFilter(crop) {
          this.activeCrop = crop;
          this.syncUrl();

        activeView: "category",

          { id: "all", label: "All products", symbol: "◌", tooltip: "Whole-catalogue symbol: compare multiple product families together.", accent: "#41565b", soft: "rgba(233, 236, 236, 0.92)", title: "Whole catalogue", copy: "Use this to compare the full visible landscape across control, support, and inoculation categories.", summaryLead: "Visible fit:" },

              { symbol: "C", label: "Crops", description: "Fruit crop contexts where the product is widely used." }
            ],
            relationship: "Read this as Input → Use benefit → Crops: the range of biostimulant benefits matters more than any single mode.",
            meta: [
              { label: "Company", value: "Kelp Products" },
              { label: "Active", value: "Ecklonia maxima seaweed extract (0.1% IAA equivalent)" },
              { label: "Form", value: "Liquid concentrate" },
              { label: "Pressure links", value: "Stress tolerance, root and yield support" }
            ],
            leftMetric: "22",
            leftLabel: "Use rows",
            rightMetric: "14",
            rightLabel: "Crops shown"
          },
          {
            categoryId: "biofertiliser",
            category: "Biofertiliser",
            icon: "F",
            iconTooltip: "Biofertiliser symbol: this record represents a nutrient or vitality support input.",
            badge: "Organic",
            badgeTone: "green",
            title: "Biotrissol",
            fit: "A compact organic fertiliser record that helps round out the category with another visible supplier",
            models: [
              { symbol: "B", label: "Input", description: "Primary object: the support input." },
              { symbol: "U", label: "Use", description: "Support-use context around the input." },
              { symbol: "S", label: "Supplier", description: "Supplier context that adds another visible reference point." }
            ],
            relationship: "Read this as Input → Use → Supplier context: the record helps the category feel broader and more real even where detail is still light.",
            meta: [
              { label: "Company", value: "Biogrow Chemicals (Pty) Ltd" },
              { label: "Description", value: "Biotrissol" },
              { label: "Pack sizes", value: "500 ml; 5 L; 10 L; 25 L" },
              { label: "Source file", value: "Organic fertilizer register" }
            ],
            leftMetric: "1",
            leftLabel: "Source row",
            rightMetric: "Yes",
            rightLabel: "Organic flag"
          }
        ],
        get activeFilters() {
          return this.filtersByView[this.activeView];
        },
        categoryTheme(categoryId) {
          return this.categories.find((category) => category.id === categoryId) || this.categories[0];
        },
        get activeCategoryTheme() {
          return this.categoryTheme(this.activeCategory);
        },
        get allCrops() {
          return [...new Set(this.products.flatMap((product) => this.extractCropLinks(product).map((crop) => crop.label)))].sort((a, b) => a.localeCompare(b));
        },
        get hasActiveFilters() {
          return this.activeCategory !== "all" || this.activeCrop !== "all" || this.searchQuery.trim().length > 0;
        },
        get resultsSummary() {
          const pieces = [`${this.filteredProducts.length} visible products`];
          if (this.activeCrop !== "all") pieces.push(`for ${this.activeCrop}`);
          if (this.activeCategory !== "all") pieces.push(`in ${this.activeCategoryTheme.label.toLowerCase()}`);
          if (this.searchQuery.trim()) pieces.push(`matching "${this.searchQuery.trim()}"`);
          return pieces.join(" ");
        },
        get filteredProducts() {
          return this.products.filter((product) => {
            const matchesCategory = this.activeCategory === "all" || product.categoryId === this.activeCategory;
            const matchesCrop = this.activeCrop === "all" || this.extractCropLinks(product).some((crop) => crop.label === this.activeCrop);
            const haystack = [
              product.title,
              product.category,
              product.fit,
              product.relationship,
              ...this.extractCropLinks(product).map((crop) => crop.label),
              ...(product.meta || []).flatMap((item) => [item.label, item.value])
            ].join(" ").toLowerCase();
            const query = this.searchQuery.trim().toLowerCase();
            const matchesQuery = !query || haystack.includes(query);
            return matchesCategory && matchesCrop && matchesQuery;
          });
        }
      };
    }
  </script>
